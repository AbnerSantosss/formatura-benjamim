# Produção via Portainer (stack a partir do Git) + túnel Cloudflare.
# Procedimento: wiki/operacao/deploy.md (Caminho B).
#
# Nenhum valor fica neste arquivo: tudo vem das variáveis da stack no Portainer.
# O app fica só em 127.0.0.1:APP_PORT do servidor (padrão 3470). Quem atende a internet é o túnel
# Cloudflare que já roda no servidor (`servidor-abner`): a rota do subdomínio aponta para
# http://localhost:3470.
x-app-env: &app-env
  NODE_ENV: production
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?defina NEXT_PUBLIC_SITE_URL=https://<dominio>}
  DATABASE_URL: postgresql://benjamim:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/benjamim
  AUTH_SECRET: ${AUTH_SECRET:-}
  CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY:-}
  CRON_SECRET: ${CRON_SECRET:-}
  PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-mercadopago}
  DEMO_MODE: "false"
  MP_ENVIRONMENT: ${MP_ENVIRONMENT:-production}
  MP_API_FLAVOR: ${MP_API_FLAVOR:-orders}
  MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
  MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
  MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
  # Opcionais: as credenciais dos três gateways também podem ser salvas no painel (ADR 015).
  FASTPAY_API_URL: ${FASTPAY_API_URL:-}
  FASTPAY_API_KEY: ${FASTPAY_API_KEY:-}
  FASTPAY_WEBHOOK_SECRET: ${FASTPAY_WEBHOOK_SECRET:-}
  IRONPAY_API_URL: ${IRONPAY_API_URL:-}
  IRONPAY_API_KEY: ${IRONPAY_API_KEY:-}
  IRONPAY_WEBHOOK_SECRET: ${IRONPAY_WEBHOOK_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
  CAMPAIGN_GOAL_CENTS: ${CAMPAIGN_GOAL_CENTS:-250000}
  CAMPAIGN_COSTS_CENTS: ${CAMPAIGN_COSTS_CENTS:-0}
  INSTAGRAM_FATHER_URL: ${INSTAGRAM_FATHER_URL:-}
  INSTAGRAM_MOTHER_URL: ${INSTAGRAM_MOTHER_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

# Log dos serviços de rotina (expirar, backup): pequeno e rotativo.
x-ops-logging: &ops-logging
  driver: json-file
  options:
    max-size: "1m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: benjamim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: benjamim
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U benjamim" ]
      interval: 5s
      timeout: 3s
      retries: 20
  # Roda uma vez a cada deploy e termina: migrações, seed (idempotente) e, se houver senha de
  # bootstrap, o administrador inicial (idempotente; não mexe em quem já entrou).
  migrate:
    build:
      context: .
      target: tools
    restart: "no"
    environment:
      <<: *app-env
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        npx prisma migrate deploy && npm run db:seed &&
        if [ -n "$$ADMIN_BOOTSTRAP_PASSWORD" ]; then npm run admin:create; fi
    depends_on:
      db: { condition: service_healthy }
  app:
    build:
      context: .
      target: runner
      args:
        # Embutido no bundle em tempo de build. Não é segredo.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?defina NEXT_PUBLIC_SITE_URL=https://<dominio>}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: [ "127.0.0.1:${APP_PORT:-3470}:3000" ]
  # Varredura de reservas vencidas: POST /api/internal/expirar a cada minuto, pela rede interna.
  # O segredo vai para o curl pela entrada padrão (-H @-), nunca na linha de comando.
  # Só escreve no log quando o estado muda (ok/falha) ou quando algum pedido expirou.
  expirar:
    image: curlimages/curl:8.22.0
    restart: unless-stopped
    init: true
    logging: *ops-logging
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      EXPIRAR_URL: http://app:3000/api/internal/expirar
      EXPIRAR_INTERVALO_S: "60"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        if [ -z "$$CRON_SECRET" ]; then
          echo "expirar: CRON_SECRET vazio, nada a fazer. Defina a variavel na stack e reimplante."
          while :; do sleep 3600; done
        fi
        estado=inicio
        while :; do
          resp=$$(printf 'Authorization: Bearer %s\n' "$$CRON_SECRET" | curl -s -m 20 -X POST -H @- -w ' %{http_code}' "$$EXPIRAR_URL" 2>/dev/null)
          codigo=$${resp##* }
          corpo=$${resp% *}
          if [ "$$codigo" = "200" ]; then
            if [ "$$estado" != "ok" ]; then
              echo "expirar: ok, varredura a cada $${EXPIRAR_INTERVALO_S}s"
              estado=ok
            fi
            case "$$corpo" in
              '{"expired":0}') ;;
              *) echo "expirar: $$corpo" ;;
            esac
          elif [ "$$estado" != "falha-$$codigo" ]; then
            echo "expirar: falha HTTP $$codigo (000 = app fora do ar, 401 = CRON_SECRET diferente do app), tentando de novo a cada $${EXPIRAR_INTERVALO_S}s"
            estado="falha-$$codigo"
          fi
          sleep "$$EXPIRAR_INTERVALO_S"
        done
    depends_on:
      app: { condition: service_started }
  # Backup do banco: um pg_dump em formato custom ao subir e depois todo dia em BACKUP_HORA_UTC,
  # no volume `backups`. Um arquivo por dia (UTC); guarda os BACKUP_MANTER mais recentes.
  # Mesma imagem do `db`, para o pg_dump ter a versão do servidor.
  # O volume fica NESTE servidor: não protege contra perda do servidor (wiki/operacao/deploy.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    logging: *ops-logging
    environment:
      PGHOST: db
      PGUSER: benjamim
      PGDATABASE: benjamim
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      BACKUP_MANTER: "14"
      BACKUP_HORA_UTC: "03:15"
    volumes: [ "backups:/backups" ]
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        umask 077
        rm -f /backups/*.tmp
        fazer_backup() {
          dia=$$(date -u +%Y-%m-%d)
          final="/backups/benjamim-$$dia.dump"
          if pg_dump -Fc -f "$$final.tmp" && pg_restore -l "$$final.tmp" > /dev/null && mv -f "$$final.tmp" "$$final"; then
            ls -1 /backups/benjamim-*.dump | sort -r | tail -n +$$((BACKUP_MANTER + 1)) | xargs -r rm -f
            echo "backup: benjamim-$$dia.dump gravado ($$(du -h "$$final" | cut -f1)), $$(ls -1 /backups/benjamim-*.dump | wc -l) arquivo(s) no volume"
            return 0
          fi
          rm -f "$$final.tmp"
          echo "backup: FALHOU em $$(date -u +%Y-%m-%dT%H:%MZ), nova tentativa em 10 minutos"
          return 1
        }
        while :; do
          if fazer_backup; then
            agora=$$(date -u +%s)
            alvo=$$(date -u -d "$$(date -u +%Y-%m-%d) $$BACKUP_HORA_UTC:00" +%s)
            [ "$$alvo" -gt "$$agora" ] || alvo=$$((alvo + 86400))
            sleep $$((alvo - agora))
          else
            sleep 600
          fi
        done
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata: {}
  backups: {}
