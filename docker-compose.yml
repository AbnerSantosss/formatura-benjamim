# Produção: wiki/operacao/deploy.md (Caminho A). Em desenvolvimento só se usa `docker compose up -d db`
# (e o perfil `dev` para o mailpit).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: benjamim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benjamim}
      POSTGRES_DB: benjamim
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    ports: [ "127.0.0.1:5442:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U benjamim" ]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      target: runner
      args:
        # Embutido no bundle em tempo de build; vem do .env. Sem ele o build para com mensagem clara.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://benjamim:${POSTGRES_PASSWORD:-benjamim}@db:5432/benjamim
    depends_on:
      db: { condition: service_healthy }
    # Só `expose`: o app nunca publica porta; quem atende a internet é o Caddy (ver wiki/operacao/seguranca.md).
    expose: [ "3000" ]
  # Ferramentas de operação (migração, seed, admin:create). Não sobe com `docker compose up`:
  #   docker compose run --rm tools npx prisma migrate deploy
  #   docker compose run --rm tools npm run db:seed
  #   docker compose run --rm tools npm run admin:create
  tools:
    profiles: [ "tools" ]
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgresql://benjamim:${POSTGRES_PASSWORD:-benjamim}@db:5432/benjamim
    depends_on:
      db: { condition: service_healthy }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [ app ]
  mailpit:
    image: axllent/mailpit
    profiles: [ "dev" ]
    ports: [ "127.0.0.1:8025:8025", "127.0.0.1:1025:1025" ]
volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
