# Produção: wiki/operacao/deploy.md (Caminho A). Em desenvolvimento só se usa `docker compose up -d db`
# (e o perfil `dev` para o mailpit).
# Log dos serviços de rotina (expirar, backup): pequeno e rotativo.
x-ops-logging: &ops-logging
  driver: json-file
  options:
    max-size: "1m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: benjamim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benjamim}
      POSTGRES_DB: benjamim
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    ports: [ "127.0.0.1:5442:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U benjamim" ]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      target: runner
      args:
        # Embutido no bundle em tempo de build; vem do .env. Sem ele o build para com mensagem clara.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://benjamim:${POSTGRES_PASSWORD:-benjamim}@db:5432/benjamim
    depends_on:
      db: { condition: service_healthy }
    # Só `expose`: o app nunca publica porta; quem atende a internet é o Caddy (ver wiki/operacao/seguranca.md).
    expose: [ "3000" ]
  # Ferramentas de operação (migração, seed, admin:create). Não sobe com `docker compose up`:
  #   docker compose run --rm tools npx prisma migrate deploy
  #   docker compose run --rm tools npm run db:seed
  #   docker compose run --rm tools npm run admin:create
  tools:
    profiles: [ "tools" ]
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgresql://benjamim:${POSTGRES_PASSWORD:-benjamim}@db:5432/benjamim
    depends_on:
      db: { condition: service_healthy }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [ app ]
  # Varredura de reservas vencidas: POST /api/internal/expirar a cada minuto, pela rede interna.
  # O segredo vai para o curl pela entrada padrão (-H @-), nunca na linha de comando.
  # Só escreve no log quando o estado muda (ok/falha) ou quando algum pedido expirou.
  expirar:
    image: curlimages/curl:8.22.0
    restart: unless-stopped
    init: true
    logging: *ops-logging
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      EXPIRAR_URL: http://app:3000/api/internal/expirar
      EXPIRAR_INTERVALO_S: "60"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        if [ -z "$$CRON_SECRET" ]; then
          echo "expirar: CRON_SECRET vazio, nada a fazer. Defina a variavel no .env e rode docker compose up -d."
          while :; do sleep 3600; done
        fi
        estado=inicio
        while :; do
          resp=$$(printf 'Authorization: Bearer %s\n' "$$CRON_SECRET" | curl -s -m 20 -X POST -H @- -w ' %{http_code}' "$$EXPIRAR_URL" 2>/dev/null)
          codigo=$${resp##* }
          corpo=$${resp% *}
          if [ "$$codigo" = "200" ]; then
            if [ "$$estado" != "ok" ]; then
              echo "expirar: ok, varredura a cada $${EXPIRAR_INTERVALO_S}s"
              estado=ok
            fi
            case "$$corpo" in
              '{"expired":0}') ;;
              *) echo "expirar: $$corpo" ;;
            esac
          elif [ "$$estado" != "falha-$$codigo" ]; then
            echo "expirar: falha HTTP $$codigo (000 = app fora do ar, 401 = CRON_SECRET diferente do app), tentando de novo a cada $${EXPIRAR_INTERVALO_S}s"
            estado="falha-$$codigo"
          fi
          sleep "$$EXPIRAR_INTERVALO_S"
        done
    depends_on:
      app: { condition: service_started }
  # Backup do banco: um pg_dump em formato custom ao subir e depois todo dia em BACKUP_HORA_UTC,
  # no volume `backups`. Um arquivo por dia (UTC); guarda os BACKUP_MANTER mais recentes.
  # Mesma imagem do `db`, para o pg_dump ter a versão do servidor.
  # O volume fica NESTE servidor: não protege contra perda do servidor (wiki/operacao/deploy.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    logging: *ops-logging
    environment:
      PGHOST: db
      PGUSER: benjamim
      PGDATABASE: benjamim
      PGPASSWORD: ${POSTGRES_PASSWORD:-benjamim}
      BACKUP_MANTER: "14"
      BACKUP_HORA_UTC: "03:15"
    volumes: [ "backups:/backups" ]
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        umask 077
        rm -f /backups/*.tmp
        fazer_backup() {
          dia=$$(date -u +%Y-%m-%d)
          final="/backups/benjamim-$$dia.dump"
          if pg_dump -Fc -f "$$final.tmp" && pg_restore -l "$$final.tmp" > /dev/null && mv -f "$$final.tmp" "$$final"; then
            ls -1 /backups/benjamim-*.dump | sort -r | tail -n +$$((BACKUP_MANTER + 1)) | xargs -r rm -f
            echo "backup: benjamim-$$dia.dump gravado ($$(du -h "$$final" | cut -f1)), $$(ls -1 /backups/benjamim-*.dump | wc -l) arquivo(s) no volume"
            return 0
          fi
          rm -f "$$final.tmp"
          echo "backup: FALHOU em $$(date -u +%Y-%m-%dT%H:%MZ), nova tentativa em 10 minutos"
          return 1
        }
        while :; do
          if fazer_backup; then
            agora=$$(date -u +%s)
            alvo=$$(date -u -d "$$(date -u +%Y-%m-%d) $$BACKUP_HORA_UTC:00" +%s)
            [ "$$alvo" -gt "$$agora" ] || alvo=$$((alvo + 86400))
            sleep $$((alvo - agora))
          else
            sleep 600
          fi
        done
    depends_on:
      db: { condition: service_healthy }
  mailpit:
    image: axllent/mailpit
    profiles: [ "dev" ]
    ports: [ "127.0.0.1:8025:8025", "127.0.0.1:1025:1025" ]
volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
  backups: {}
